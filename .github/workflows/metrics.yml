# Save to: .github/workflows/metrics.yml (in the power-code129/power-code129 repo)
# Requires a secret named METRICS_TOKEN — a Personal Access Token (classic)
# with "repo" and "read:user" scopes. Create it at github.com/settings/tokens
# then add it under Settings → Secrets and variables → Actions.
name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_habits: yes
          plugin_habits_charts_type: bar

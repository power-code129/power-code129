# Save to: .github/workflows/pacman.yml (in the power-code129/power-code129 repo)
name: Generate Pacman Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pacman contribution graph
        uses: IzzyOnDroid/pacman-contribution-graph@v1
        with:
          github_user_name: power-code129
          output: pacman-contribution-graph.svg

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
